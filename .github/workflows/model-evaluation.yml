name: Model evaluation

on:
  pull_request:
    paths-ignore: ["docs/**", "README.md", "evaluation/baseline/**"]
  push:
    branches: [main]
    paths-ignore: ["docs/**", "README.md", "evaluation/baseline/**"]
  workflow_dispatch:
    inputs:
      include_medium:
        description: Also evaluate the larger medium model
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: evaluation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    name: Evaluate ${{ matrix.model }} (macOS)
    runs-on: macos-14
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.include_medium && '["base","small","medium"]' || '["base","small"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            crates/local-transcription/target
          key: macos-${{ runner.arch }}-evaluation-rust-v1-${{ hashFiles('crates/local-transcription/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Check scorer and benchmark binary
        run: |
          python3 -m unittest discover -s scripts/tests -v
          cargo fmt --manifest-path crates/local-transcription/Cargo.toml -- --check
          cargo clippy --manifest-path crates/local-transcription/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path crates/local-transcription/Cargo.toml --locked
          cargo build --manifest-path crates/local-transcription/Cargo.toml --release --locked --bin evaluate
      - name: Prepare fixed model (setup only)
        run: python3 scripts/prepare-transcription-model.py --model '${{ matrix.model }}' "$RUNNER_TEMP/model.bin"
      - name: Evaluate CPU and actual Metal with networking denied
        timeout-minutes: 40
        run: |
          evidence="$RUNNER_TEMP/model-evaluation"
          mkdir -p "$evidence"
          cp evaluation/corpus.json evaluation/fixtures/README.md evaluation/fixtures/CC-BY-4.0.txt "$evidence/"
          policy='(version 1) (allow default) (deny network*)'
          for backend in cpu metal; do
            sandbox-exec -p "$policy" python3 scripts/evaluate_models.py \
              --binary crates/local-transcription/target/release/evaluate \
              --model "$RUNNER_TEMP/model.bin" --model-name '${{ matrix.model }}' \
              --backend "$backend" --output "$evidence/$backend" \
              --require-network-denied --timeout 1800 \
              2>&1 | tee "$evidence/$backend.log"
          done
      - name: Compare related and unrelated local hints with networking denied
        timeout-minutes: 20
        run: |
          sandbox-exec -p '(version 1) (allow default) (deny network*)' \
            python3 scripts/evaluate_context.py \
              --binary crates/local-transcription/target/release/evaluate \
              --model "$RUNNER_TEMP/model.bin" --model-name '${{ matrix.model }}' \
              --output "$RUNNER_TEMP/model-evaluation/context"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-evaluation-${{ matrix.model }}
          path: ${{ runner.temp }}/model-evaluation/
          retention-days: 14
          if-no-files-found: warn

  summary:
    name: Compare complete evaluation results
    needs: evaluate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: model-evaluation-*
          path: ${{ runner.temp }}/evaluation-reports
      - name: Publish comparison and provisional CPU ranking
        env:
          EVALUATION_MODELS: ${{ github.event_name == 'workflow_dispatch' && inputs.include_medium && '["base","small","medium"]' || '["base","small"]' }}
        run: |
          python3 scripts/summarize_evaluation.py "$RUNNER_TEMP/evaluation-reports" \
            "$RUNNER_TEMP/evaluation-summary" --models "$EVALUATION_MODELS" --require-network-denied
          cat "$RUNNER_TEMP/evaluation-summary/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: model-evaluation-summary
          path: ${{ runner.temp }}/evaluation-summary/
          retention-days: 14

  correction:
    name: Local correction ${{ matrix.model }} (macOS)
    needs: evaluate
    runs-on: macos-14
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    strategy:
      fail-fast: false
      matrix:
        model: [qwen3-1.7b, qwen3-4b]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: actions/cache/restore@v4
        id: correction-cache
        with:
          path: |
            ~/.cargo/registry
            crates/local-correction/target
          key: macos-${{ runner.arch }}-correction-runtime-v2-${{ hashFiles('crates/local-correction/Cargo.lock', 'rust-toolchain.toml') }}
      - uses: actions/download-artifact@v4
        with:
          name: model-evaluation-small
          path: ${{ runner.temp }}/small-asr
      - name: Build and test local correction engine
        run: |
          cargo fmt --manifest-path crates/local-correction/Cargo.toml -- --check
          cargo clippy --manifest-path crates/local-correction/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path crates/local-correction/Cargo.toml --locked
          cargo build --manifest-path crates/local-correction/Cargo.toml --release --locked
      - uses: actions/cache/save@v4
        if: steps.correction-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            crates/local-correction/target
          key: ${{ steps.correction-cache.outputs.cache-primary-key }}
      - name: Prepare checksum-verified official model (setup only)
        run: python3 scripts/prepare-correction-model.py --model '${{ matrix.model }}' "$RUNNER_TEMP/correction-model.gguf"
      - name: Compare all four context routes with networking denied
        run: |
          mkdir -p "$RUNNER_TEMP/correction-evaluation"
          sandbox-exec -p '(version 1) (allow default) (deny network*)' \
            python3 scripts/evaluate_correction.py \
              --binary crates/local-correction/target/release/local-correction \
              --model "$RUNNER_TEMP/correction-model.gguf" --model-name '${{ matrix.model }}' \
              --asr "$RUNNER_TEMP/small-asr/context" --output "$RUNNER_TEMP/correction-evaluation" \
              --require-network-denied \
              2>&1 | tee "$RUNNER_TEMP/correction-evaluation/run.log"
          cat "$RUNNER_TEMP/correction-evaluation/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correction-evaluation-${{ matrix.model }}
          path: ${{ runner.temp }}/correction-evaluation/
          retention-days: 14
          if-no-files-found: warn
