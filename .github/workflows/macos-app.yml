name: macOS app checks

on:
  workflow_call:
    inputs:
      full_integration:
        description: Run real permissions, recording, OCR and insertion scenarios
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  macos:
    name: ${{ inputs.full_integration && 'macOS full integration' || 'macOS build and window smoke' }}
    runs-on: macos-26
    timeout-minutes: ${{ inputs.full_integration && 60 || 15 }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    defaults:
      run:
        # Explicit Bash enables -e -o pipefail, including commands piped to tee.
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Cache immutable registry publication metadata
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/voice-input-release-metadata
          key: registry-age-${{ runner.os }}-v1-${{ hashFiles('**/Cargo.lock', 'package.json') }}
          restore-keys: registry-age-${{ runner.os }}-v1-
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apple-foundation-runtime
          path: ${{ runner.temp }}/foundation-runtime
      - name: Verify helper provenance and protocol on the current macOS
        run: |
          echo "VOICE_INPUT_FOUNDATION_RUNTIME=$RUNNER_TEMP/foundation-runtime/apple-foundation-correction" >> "$GITHUB_ENV"
          python3 - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'foundation-runtime'
          provenance = json.loads((root / 'provenance.json').read_text())
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          assert provenance['source_revision'] == os.environ['GITHUB_SHA']
          assert provenance['source_sha256'] == digest(Path('scripts/apple-foundation-correction.swift'))
          binary = root / 'apple-foundation-correction'
          assert provenance['binary_sha256'] == digest(binary)
          binary.chmod(0o755)
          PYCODE
          sandbox-exec -p '(version 1) (allow default) (deny network*)' \
            python3 scripts/verify-foundation-runtime.py --require-framework \
            --binary "$RUNNER_TEMP/foundation-runtime/apple-foundation-correction" \
            --output "$RUNNER_TEMP/foundation-runtime/host-verification.json"
      - name: Record requested CI scope
        env:
          VOICE_INPUT_FULL_INTEGRATION: ${{ inputs.full_integration }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          full = os.environ['VOICE_INPUT_FULL_INTEGRATION'].lower() == 'true'
          mode = 'full-integration' if full else 'build-window-smoke'
          root = Path(os.environ['RUNNER_TEMP']) / 'voice-input-smoke'
          root.mkdir(parents=True, exist_ok=True)
          import shutil
          shutil.copyfile(Path(os.environ['RUNNER_TEMP']) / 'foundation-runtime/host-verification.json', root / 'foundation-runtime.json')
          (root / 'coverage.json').write_text(json.dumps(dict(requested_scope=mode, source_revision=os.environ['GITHUB_SHA']))+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'CI scope: **{mode}**. Full permission/audio/OCR/insertion scenarios run on the weekly schedule or explicit full dispatch.\n')
          PYCODE
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            src-tauri/target
          key: macos26-${{ runner.arch }}-app-rust-v1-${{ hashFiles('src-tauri/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: macos26-${{ runner.arch }}-app-rust-v1-
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: correction-cache
        with:
          path: |
            ~/.cargo/registry
            crates/local-correction/target
          key: macos26-${{ runner.arch }}-correction-runtime-v2-${{ hashFiles('crates/local-correction/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: macos26-${{ runner.arch }}-correction-runtime-v2-
      - name: Restore previous correction target cache
        if: steps.correction-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: crates/local-correction/target
          key: macos26-${{ runner.arch }}-correction-runtime-v1-${{ hashFiles('crates/local-correction/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Test evaluation helpers
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Test pinned model preparation without networking
        run: |
          cargo fmt --manifest-path crates/local-models/Cargo.toml -- --check
          cargo clippy --manifest-path crates/local-models/Cargo.toml --locked --all-targets -- -D warnings
          sandbox-exec -p '(version 1) (allow default) (deny network*)' \
            cargo test --manifest-path crates/local-models/Cargo.toml --locked --offline
      - name: Test comparison planning and reference metrics
        run: |
          cargo fmt --manifest-path crates/local-comparison/Cargo.toml -- --check
          cargo clippy --manifest-path crates/local-comparison/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path crates/local-comparison/Cargo.toml --locked
      - name: Check and build isolated local correction runtime
        run: |
          cargo fmt --manifest-path crates/local-correction/Cargo.toml -- --check
          cargo clippy --manifest-path crates/local-correction/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path crates/local-correction/Cargo.toml --locked
          pnpm run prepare-native
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.correction-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            crates/local-correction/target
          key: ${{ steps.correction-cache.outputs.cache-primary-key }}
      - name: Verify fixed correction decisions without a model or network
        run: |
          cargo build --manifest-path crates/local-correction/Cargo.toml --release --locked --bin check-guards
          sandbox-exec -p '(version 1) (allow default) (deny network*)' \
            python3 scripts/evaluate_guard_regression.py \
              --binary crates/local-correction/target/release/check-guards \
              --output "$RUNNER_TEMP/voice-input-smoke/guards" --require-network-denied
          cat "$RUNNER_TEMP/voice-input-smoke/guards/summary.md" >> "$GITHUB_STEP_SUMMARY"
          sandbox-exec -p '(version 1) (allow default) (deny network*)' \
            python3 scripts/verify-correction-validation.py --binary src-tauri/resources/local-correction
      - name: Inspect macOS permission automation support
        run: |
          mkdir -p "$RUNNER_TEMP/voice-input-smoke"
          xcrun swift -e 'import ApplicationServices; print("accessibilityTrusted=\(AXIsProcessTrusted()) canPostEvents=\(CGPreflightPostEventAccess())")' \
            | tee "$RUNNER_TEMP/voice-input-smoke/permissions-preflight.log"
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Build frontend
        run: pnpm run build
      - name: Check Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test local audio processing
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build unsigned macOS app
        run: pnpm run tauri build --bundles app --ci -- --locked
        env:
          APPLE_SIGNING_IDENTITY: "-"
      # Save after a successful build even if a later native UI check fails.
      # Cargo rechecks local sources when restoring this dependency/build cache.
      - name: Save Rust build cache
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            src-tauri/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Build observable native context fixture
        if: inputs.full_integration
        run: |
          fixture="$RUNNER_TEMP/Local Context Fixture.app"
          mkdir -p "$fixture/Contents/MacOS"
          xcrun swiftc scripts/macos-context-target.swift -o "$fixture/Contents/MacOS/context-fixture"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string dev.toyb0x.contextfixture' "$fixture/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string context-fixture' "$fixture/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleName string Local Context Fixture' "$fixture/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundlePackageType string APPL' "$fixture/Contents/Info.plist"
          codesign --force --sign - "$fixture"
      - name: Prepare pinned correction model and synthetic OCR app
        if: inputs.full_integration
        timeout-minutes: 10
        run: |
          python3 scripts/prepare-correction-model.py "$RUNNER_TEMP/correction-model.gguf"
          fixture="$RUNNER_TEMP/Local OCR Fixture.app"
          mkdir -p "$fixture/Contents/MacOS"
          xcrun swiftc scripts/macos-ocr-target.swift -o "$fixture/Contents/MacOS/ocr-fixture"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string dev.toyb0x.ocrfixture' "$fixture/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string ocr-fixture' "$fixture/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleName string Local OCR Fixture' "$fixture/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundlePackageType string APPL' "$fixture/Contents/Info.plist"
          codesign --force --sign - "$fixture"
      - name: Verify bundled CPU inference and Metal capability with networking denied
        if: inputs.full_integration
        id: correction-probe
        run: |
          sandbox-exec -p '(version 1) (allow default) (deny network*)' python3 - <<'PYCODE'
          import json, os, subprocess, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from evaluate_correction import metal_unavailable
          root = Path(os.environ['RUNNER_TEMP']) / 'voice-input-smoke'
          binary = Path('src-tauri/target/release/bundle/macos/Voice Input.app/Contents/Resources/bin/local-correction').resolve()
          model = Path(os.environ['RUNNER_TEMP']) / 'correction-model.gguf'
          for backend in ['cpu', 'metal']:
              result = subprocess.run([str(binary), str(model), backend],
                  input=json.dumps(dict(transcript='会議は金曜日です', context='会議、金曜日。'), ensure_ascii=False),
                  text=True, capture_output=True, timeout=180)
              (root / f'correction-{backend}-probe.json').write_text(result.stdout)
              # This CI probe uses only the fixed synthetic sentence and public model.
              (root / f'correction-{backend}-probe.stderr.log').write_text(result.stderr)
              if result.returncode:
                  failure = json.loads(result.stdout) if result.stdout.strip() else {}
                  if backend == 'metal' and metal_unavailable(failure):
                      print('Metal inference NOT verified: host lacks required GPU capability; CPU remains explicitly selectable.')
                      continue
                  raise SystemExit(f'Bundled correction {backend} probe failed; inspect the fixed stage in correction-{backend}-probe.json')
              report = json.loads(result.stdout)
              assert report['backend'] == backend and report['text']
              assert (report['offloaded_layers'] == 0) if backend == 'cpu' else (report['offloaded_layers'] > 0)
          PYCODE
      - name: Measure fresh correction processes on fixed synthetic input offline
        if: inputs.full_integration
        timeout-minutes: 8
        run: |
          sandbox-exec -p '(version 1) (allow default) (deny network*)' \
            python3 scripts/measure_correction.py \
            --binary "src-tauri/target/release/bundle/macos/Voice Input.app/Contents/Resources/bin/local-correction" \
            --model "$RUNNER_TEMP/correction-model.gguf" --runs 3 \
            --output "$RUNNER_TEMP/voice-input-smoke/correction-performance"
          cat "$RUNNER_TEMP/voice-input-smoke/correction-performance/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify bundled correction runtime starts without a model or network
        run: |
          runtime="$PWD/src-tauri/target/release/bundle/macos/Voice Input.app/Contents/Resources/bin/local-correction"
          test -x "$runtime"
          printf '%s' '{"transcript":"","context":""}' | \
            sandbox-exec -p '(version 1) (allow default) (deny network*)' "$runtime" /missing/model.gguf cpu \
            > "$RUNNER_TEMP/voice-input-smoke/runtime-probe.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'voice-input-smoke/runtime-probe.json').read_text())
          assert report['text'] == '' and report['offloaded_layers'] == 0
          PY
      - name: Verify native window and capture screenshot
        timeout-minutes: 3
        run: |
          mkdir -p "$RUNNER_TEMP/voice-input-smoke"
          cp scripts/macos-window-smoke.swift "$RUNNER_TEMP/main.swift"
          xcrun swiftc "$RUNNER_TEMP/main.swift" scripts/macos-recording-interaction.swift scripts/macos-insertion-interaction.swift scripts/macos-context-interaction.swift scripts/macos-ocr-interaction.swift scripts/macos-model-interaction.swift scripts/macos-foundation-interaction.swift scripts/macos-comparison-interaction.swift \
            -o "$RUNNER_TEMP/voice-input-smoke-runner" \
            2>&1 | tee "$RUNNER_TEMP/voice-input-smoke/swift-build.log"
          "$RUNNER_TEMP/voice-input-smoke-runner" \
            "$PWD/src-tauri/target/release/bundle/macos/Voice Input.app" \
            "$RUNNER_TEMP/voice-input-smoke" \
            2>&1 | tee "$RUNNER_TEMP/voice-input-smoke/smoke.log"
      - name: Verify Apple engine selection and body-free diagnostics in the actual app
        timeout-minutes: 3
        run: |
          "$RUNNER_TEMP/voice-input-smoke-runner" \
            "$PWD/src-tauri/target/release/bundle/macos/Voice Input.app" \
            "$RUNNER_TEMP/voice-input-smoke/foundation" foundation
      - name: Verify comparison screen, full condition plan and safe empty-recording rejection
        timeout-minutes: 3
        run: |
          "$RUNNER_TEMP/voice-input-smoke-runner" \
            "$PWD/src-tauri/target/release/bundle/macos/Voice Input.app" \
            "$RUNNER_TEMP/voice-input-smoke/comparison" comparison
      - name: Verify explicit model preparation, cancellation and preset isolation
        if: inputs.full_integration
        timeout-minutes: 14
        run: |
          "$RUNNER_TEMP/voice-input-smoke-runner" \
            "$PWD/src-tauri/target/release/bundle/macos/Voice Input.app" \
            "$RUNNER_TEMP/voice-input-smoke/models" models
      - name: Verify managed model restoration and cached verification
        if: inputs.full_integration
        timeout-minutes: 4
        run: |
          "$RUNNER_TEMP/voice-input-smoke-runner" \
            "$PWD/src-tauri/target/release/bundle/macos/Voice Input.app" \
            "$RUNNER_TEMP/voice-input-smoke/models-restore" models-restore
      - name: Install virtual microphone for synthetic audio
        if: inputs.full_integration
        timeout-minutes: 5
        run: |
          brew install --cask blackhole-2ch
          brew install switchaudio-osx
          sudo killall coreaudiod
          for attempt in {1..30}; do
            if SwitchAudioSource -a -t input | grep -Fxq 'BlackHole 2ch'; then
              break
            fi
            sleep 1
          done
          SwitchAudioSource -s 'BlackHole 2ch' -t input
          SwitchAudioSource -s 'BlackHole 2ch' -t output
          SwitchAudioSource -c -t input | tee "$RUNNER_TEMP/voice-input-smoke/input-device.txt"
          xcrun swift scripts/macos-ci-audio-buffer.swift \
            | tee "$RUNNER_TEMP/voice-input-smoke/virtual-audio-buffer.json"
      - name: Verify real microphone permission and recording controls
        if: inputs.full_integration
        timeout-minutes: 5
        run: |
          app="$PWD/src-tauri/target/release/bundle/macos/Voice Input.app"
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app/Contents/Info.plist"
          codesign --verify --strict "$app"
          codesign -d --entitlements :- "$app" \
            > "$RUNNER_TEMP/voice-input-smoke/entitlements.plist" \
            2> "$RUNNER_TEMP/voice-input-smoke/codesign.log"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.audio-input' "$RUNNER_TEMP/voice-input-smoke/entitlements.plist")" = true
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$app"
          tccutil reset Microphone dev.toyb0x.voiceinput
          "$RUNNER_TEMP/voice-input-smoke-runner" "$app" \
            "$RUNNER_TEMP/voice-input-smoke/permission-denied" deny \
            2>&1 | tee "$RUNNER_TEMP/voice-input-smoke/permission-denied.log"
          tccutil reset Microphone dev.toyb0x.voiceinput
          python3 - <<'PY'
          import array, math, os, wave
          from pathlib import Path
          tone = array.array('h', (int(math.sin(i * 2 * math.pi * 440 / 48000) * 8192) for i in range(48000)))
          with wave.open(str(Path(os.environ['RUNNER_TEMP']) / 'voice-input-tone.wav'), 'wb') as audio:
              audio.setparams((1, 2, 48000, 0, 'NONE', 'not compressed'))
              audio.writeframes(tone.tobytes() * 60)
          PY
          afplay "$RUNNER_TEMP/voice-input-tone.wav" \
            > "$RUNNER_TEMP/voice-input-smoke/tone.log" 2>&1 &
          tone_pid=$!
          trap 'kill "$tone_pid" 2>/dev/null || true' EXIT
          "$RUNNER_TEMP/voice-input-smoke-runner" "$app" \
            "$RUNNER_TEMP/voice-input-smoke/permission-allowed" allow \
            2>&1 | tee "$RUNNER_TEMP/voice-input-smoke/permission-allowed.log"
      - name: Prepare local model for app integration
        if: inputs.full_integration
        # A neutral filename verifies UI identity comes from loaded weights.
        run: python3 scripts/prepare-transcription-model.py "$RUNNER_TEMP/local-model.bin"
      - name: Verify Japanese recording to transcription and clipboard
        if: inputs.full_integration
        timeout-minutes: 7
        env:
          VOICE_INPUT_TEST_MODEL: ${{ runner.temp }}/local-model.bin
          VOICE_INPUT_TEST_AUDIO: ${{ github.workspace }}/crates/local-transcription/tests/fixtures/ja-oku.wav
        run: |
          tccutil reset Microphone dev.toyb0x.voiceinput
          "$RUNNER_TEMP/voice-input-smoke-runner" \
            "$PWD/src-tauri/target/release/bundle/macos/Voice Input.app" \
            "$RUNNER_TEMP/voice-input-smoke/transcription" transcribe \
            2>&1 | tee "$RUNNER_TEMP/voice-input-smoke/transcription.log"
      - name: Verify resident tray, background shortcut and preference restoration
        if: inputs.full_integration
        timeout-minutes: 8
        env:
          VOICE_INPUT_TEST_MODEL: ${{ runner.temp }}/local-model.bin
          VOICE_INPUT_TEST_AUDIO: ${{ github.workspace }}/crates/local-transcription/tests/fixtures/ja-oku.wav
        run: |
          "$RUNNER_TEMP/voice-input-smoke-runner" \
            "$PWD/src-tauri/target/release/bundle/macos/Voice Input.app" \
            "$RUNNER_TEMP/voice-input-smoke/desktop" desktop \
            2>&1 | tee "$RUNNER_TEMP/voice-input-smoke/desktop.log"
      - name: Build synthetic native guard fields
        if: inputs.full_integration
        run: |
          fixture="$RUNNER_TEMP/Insertion Guard Fixture.app"
          mkdir -p "$fixture/Contents/MacOS"
          xcrun swiftc scripts/macos-insertion-target.swift -o "$fixture/Contents/MacOS/guard-fixture"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string dev.toyb0x.insertionfixture' "$fixture/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string guard-fixture' "$fixture/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleName string Insertion Guard Fixture' "$fixture/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundlePackageType string APPL' "$fixture/Contents/Info.plist"
          codesign --force --sign - "$fixture"
      - name: Verify untrusted context falls back to audio only
        if: inputs.full_integration
        timeout-minutes: 5
        env:
          VOICE_INPUT_TEST_AUDIO: ${{ github.workspace }}/crates/local-transcription/tests/fixtures/ja-oku.wav
        run: |
          tccutil reset Accessibility dev.toyb0x.voiceinput
          "$RUNNER_TEMP/voice-input-smoke-runner" \
            "$PWD/src-tauri/target/release/bundle/macos/Voice Input.app" \
            "$RUNNER_TEMP/voice-input-smoke/context-denied" context-denied \
            2>&1 | tee "$RUNNER_TEMP/voice-input-smoke/context-denied.log"
      - name: Verify untrusted product refuses direct insertion
        if: inputs.full_integration
        timeout-minutes: 5
        env:
          VOICE_INPUT_TEST_AUDIO: ${{ github.workspace }}/crates/local-transcription/tests/fixtures/ja-oku.wav
        run: |
          tccutil reset Accessibility dev.toyb0x.voiceinput
          "$RUNNER_TEMP/voice-input-smoke-runner" \
            "$PWD/src-tauri/target/release/bundle/macos/Voice Input.app" \
            "$RUNNER_TEMP/voice-input-smoke/insertion-denied" insertion-denied \
            2>&1 | tee "$RUNNER_TEMP/voice-input-smoke/insertion-denied.log"
      - name: Allow product Accessibility through System Settings in disposable CI
        if: inputs.full_integration
        timeout-minutes: 4
        env:
          VOICE_INPUT_CI_AUTH_FILE: ${{ runner.temp }}/voice-input-ci-authorization.json
        run: |
          # A fresh, disposable credential only for this runner's real OS dialog.
          # Never print it, include it in exceptions, or put it under artifacts.
          python3 - <<'PY'
          import json, os, secrets, subprocess
          from pathlib import Path
          credential = dict(username='voiceinput-ci', password=secrets.token_hex(24))
          path = Path(os.environ['VOICE_INPUT_CI_AUTH_FILE'])
          with open(path, 'w', opener=lambda p, f: os.open(p, f, 0o600)) as output:
              json.dump(credential, output)
          result = subprocess.run(['sudo', 'sysadminctl', '-addUser', credential['username'],
              '-fullName', 'Voice Input CI', '-home', str(path.parent / 'voice-input-ci-home'),
              '-password', credential['password'], '-admin'], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          if result.returncode:
              raise SystemExit('Could not create disposable CI authorization account')
          PY
          "$RUNNER_TEMP/voice-input-smoke-runner" \
            "$PWD/src-tauri/target/release/bundle/macos/Voice Input.app" \
            "$RUNNER_TEMP/voice-input-smoke/insertion-grant" insertion-grant \
            2>&1 | tee "$RUNNER_TEMP/voice-input-smoke/insertion-grant.log"
      - name: Inspect only this product's OS authorization metadata
        if: ${{ inputs.full_integration && (always()) }}
        run: |
          evidence="$RUNNER_TEMP/voice-input-smoke/authorization-metadata.log"
          app="$PWD/src-tauri/target/release/bundle/macos/Voice Input.app"
          codesign -d -r- "$app" 2>&1 | tee "$evidence"
          for database in "/Library/Application Support/com.apple.TCC/TCC.db" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do
            if sudo test -f "$database"; then
              sudo /usr/bin/sqlite3 "$database" "SELECT client,client_type,auth_value,auth_reason,length(csreq) FROM access WHERE service='kTCCServiceAccessibility' AND (client='dev.toyb0x.voiceinput' OR client LIKE '%Voice Input%');" \
                2>&1 | tee -a "$evidence" || true
            fi
          done
      - name: Verify denied screen permission leaves voice input usable
        if: inputs.full_integration
        timeout-minutes: 5
        env:
          VOICE_INPUT_TEST_AUDIO: ${{ github.workspace }}/crates/local-transcription/tests/fixtures/ja-oku.wav
          VOICE_INPUT_OCR_TARGET: ${{ runner.temp }}/Local OCR Fixture.app
        run: |
          tccutil reset ScreenCapture dev.toyb0x.voiceinput
          "$RUNNER_TEMP/voice-input-smoke-runner" \
            "$PWD/src-tauri/target/release/bundle/macos/Voice Input.app" \
            "$RUNNER_TEMP/voice-input-smoke/ocr-denied" ocr-denied \
            2>&1 | tee "$RUNNER_TEMP/voice-input-smoke/ocr-denied.log"
      - name: Grant real product Screen Recording consent
        if: inputs.full_integration
        timeout-minutes: 5
        env:
          VOICE_INPUT_CI_AUTH_FILE: ${{ runner.temp }}/voice-input-ci-authorization.json
        run: |
          "$RUNNER_TEMP/voice-input-smoke-runner" \
            "$PWD/src-tauri/target/release/bundle/macos/Voice Input.app" \
            "$RUNNER_TEMP/voice-input-smoke/ocr-grant" ocr-grant \
            2>&1 | tee "$RUNNER_TEMP/voice-input-smoke/ocr-grant.log"
          pkill -x voice-input || true
      - name: Verify real OCR, correction preview, copy and cancellation
        if: inputs.full_integration
        timeout-minutes: 10
        env:
          VOICE_INPUT_TEST_AUDIO: ${{ github.workspace }}/crates/local-transcription/tests/fixtures/ja-oku.wav
          VOICE_INPUT_OCR_TARGET: ${{ runner.temp }}/Local OCR Fixture.app
          VOICE_INPUT_CORRECTION_MODEL: ${{ runner.temp }}/correction-model.gguf
        run: |
          "$RUNNER_TEMP/voice-input-smoke-runner" \
            "$PWD/src-tauri/target/release/bundle/macos/Voice Input.app" \
            "$RUNNER_TEMP/voice-input-smoke/ocr" ocr \
            2>&1 | tee "$RUNNER_TEMP/voice-input-smoke/ocr.log"
      - name: Verify bounded context, opt-out and protected field exclusions
        if: inputs.full_integration
        timeout-minutes: 10
        env:
          VOICE_INPUT_TEST_AUDIO: ${{ github.workspace }}/crates/local-transcription/tests/fixtures/ja-oku.wav
          VOICE_INPUT_CONTEXT_TARGET: ${{ runner.temp }}/Local Context Fixture.app
        run: |
          "$RUNNER_TEMP/voice-input-smoke-runner" \
            "$PWD/src-tauri/target/release/bundle/macos/Voice Input.app" \
            "$RUNNER_TEMP/voice-input-smoke/context" context \
            2>&1 | tee "$RUNNER_TEMP/voice-input-smoke/context.log"
      - name: Verify context preference restores without retained text
        if: inputs.full_integration
        timeout-minutes: 3
        run: |
          "$RUNNER_TEMP/voice-input-smoke-runner" \
            "$PWD/src-tauri/target/release/bundle/macos/Voice Input.app" \
            "$RUNNER_TEMP/voice-input-smoke/context-restore" context-restore \
            2>&1 | tee "$RUNNER_TEMP/voice-input-smoke/context-restore.log"
          python3 - <<'PY'
          import json
          from pathlib import Path
          settings = json.loads((Path.home() / 'Library/Application Support/dev.toyb0x.voiceinput/settings.json').read_text())
          assert settings['recognitionContext'] is True
          assert settings['correctionEngine'] == 'qwen3'
          assert set(settings) == {'version', 'modelPath', 'backend', 'shortcut', 'autoInsert', 'recognitionContext', 'ocrContext', 'whisperContext', 'correctionContext', 'correctionModelPath', 'correctionBackend', 'correctionEngine'}
          PY
      - name: Verify trusted product insertion and cancellation guards
        if: inputs.full_integration
        timeout-minutes: 12
        env:
          VOICE_INPUT_TEST_AUDIO: ${{ github.workspace }}/crates/local-transcription/tests/fixtures/ja-oku.wav
          VOICE_INPUT_INSERTION_TARGET: ${{ runner.temp }}/Insertion Guard Fixture.app
        run: |
          "$RUNNER_TEMP/voice-input-smoke-runner" \
            "$PWD/src-tauri/target/release/bundle/macos/Voice Input.app" \
            "$RUNNER_TEMP/voice-input-smoke/insertion" insertion \
            2>&1 | tee "$RUNNER_TEMP/voice-input-smoke/insertion.log"
      - name: Diagnose native correction failure with synthetic data only
        if: ${{ inputs.full_integration && (failure() && steps.correction-probe.outcome == 'failure') }}
        timeout-minutes: 5
        continue-on-error: true
        run: |
          cargo build --manifest-path crates/local-correction/Cargo.toml --release --locked --features ci-diagnostics
          sandbox-exec -p '(version 1) (allow default) (deny network*)' python3 - <<'PYDIAG'
          import json, os, subprocess
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'voice-input-smoke'
          result = subprocess.run([str(Path('crates/local-correction/target/release/local-correction').resolve()),
              str(Path(os.environ['RUNNER_TEMP']) / 'correction-model.gguf'), 'metal'],
              input=json.dumps(dict(transcript='会議は金曜日です',context='会議、金曜日。'),ensure_ascii=False),
              text=True,capture_output=True,timeout=180)
          (root / 'synthetic-metal-diagnostic.stdout.log').write_text(result.stdout)
          (root / 'synthetic-metal-diagnostic.stderr.log').write_text(result.stderr)
          (root / 'synthetic-metal-diagnostic-exit.json').write_text(json.dumps(dict(exit_status=result.returncode)))
          PYDIAG
      - name: Remove disposable CI authorization account
        if: ${{ inputs.full_integration && (always()) }}
        run: |
          sudo sysadminctl -deleteUser voiceinput-ci >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/voice-input-ci-authorization.json"
      - name: Check compiler and smoke failure exit statuses
        run: |
          negative="$RUNNER_TEMP/voice-input-smoke/expected-failures"
          mkdir -p "$negative"
          printf '%s\n' '#error("Expected compiler failure for CI regression check")' \
            > "$negative/invalid.swift"

          # Capture intentional failures without disabling pipefail. If tee masks
          # either producer's exit status, this regression check must fail.
          set +e
          xcrun swiftc "$negative/invalid.swift" -o "$negative/invalid" \
            2>&1 | tee "$negative/swift-build.log"
          compile_status=$?
          "$RUNNER_TEMP/voice-input-smoke-runner" \
            "$negative/missing.app" "$negative/smoke" \
            2>&1 | tee "$negative/smoke.log"
          smoke_status=$?
          set -e

          printf '{"compile_status": %d, "smoke_status": %d}\n' \
            "$compile_status" "$smoke_status" > "$negative/exit-statuses.json"
          if [[ "$compile_status" -eq 0 || "$smoke_status" -ne 1 ]]; then
            echo "::error::Compiler or smoke failure was not propagated through tee"
            exit 1
          fi
      - name: Package the tested app for personal device debugging
        run: |
          mkdir -p "$RUNNER_TEMP/voice-input-app"
          ditto -c -k --sequesterRsrc --keepParent \
            "src-tauri/target/release/bundle/macos/Voice Input.app" \
            "$RUNNER_TEMP/voice-input-app/Voice-Input-macos.zip"
          python3 - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'voice-input-app'
          archive = root / 'Voice-Input-macos.zip'
          (root / 'provenance.json').write_text(json.dumps(dict(source_revision=os.environ['GITHUB_SHA'],
              architecture=os.environ['RUNNER_ARCH'], developer_id_signed=False, notarized=False,
              archive_sha256=hashlib.sha256(archive.read_bytes()).hexdigest()))+'\n')
          PYCODE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: voice-input-macos26-${{ runner.arch }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/voice-input-app/
          retention-days: 14
          if-no-files-found: error
      - name: Upload native window evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-window-smoke-${{ github.run_attempt }}
          path: ${{ runner.temp }}/voice-input-smoke/
          retention-days: 14
          if-no-files-found: warn

