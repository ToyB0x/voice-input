name: Japanese context evidence

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: context-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dependency-policy:
    uses: ./.github/workflows/dependency-policy.yml
  measure:
    name: Measure synthetic Japanese context locally
    needs: dependency-policy
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5
        with:
          version: 2026.10.18
          cache: true
          cache_key: mise-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise/config.toml', 'rust-toolchain.toml') }}
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: engine-cache
        with:
          path: |
            ~/.cargo/registry
            crates/local-correction/target
            crates/local-transcription/target
          key: context-evidence-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/local-correction/Cargo.lock', 'crates/local-transcription/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: macos27-${{ runner.arch }}-correction-runtime-v2-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/voice-input-context-models
          key: context-evidence-models-v1-${{ hashFiles('crates/local-models/catalog.json') }}
      - name: Build existing production inference engines and research fixture
        run: |
          cargo build --manifest-path crates/local-correction/Cargo.toml --release --locked
          cargo build --manifest-path crates/local-transcription/Cargo.toml --release --locked --bin compare-transcription
          python3 scripts/build-foundation-runtime.py --output "$RUNNER_TEMP/foundation" --require-framework
          xcrun swiftc -O scripts/context-evidence-native.swift -o "$RUNNER_TEMP/context-native"
          codesign --force --sign - "$RUNNER_TEMP/context-native"
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.engine-cache.outputs.cache-hit != 'true'
        with:
          path: |
            ~/.cargo/registry
            crates/local-correction/target
            crates/local-transcription/target
          key: ${{ steps.engine-cache.outputs.cache-primary-key }}
      - name: Prepare checksum verified models (setup network only)
        run: |
          mkdir -p "$HOME/.cache/voice-input-context-models"
          python3 scripts/prepare-transcription-model.py --model base "$HOME/.cache/voice-input-context-models/base.bin"
          python3 scripts/prepare-correction-model.py --model qwen3-1.7b "$HOME/.cache/voice-input-context-models/correction.gguf"
      - name: Render fixture windows and synthesize shared Japanese speech offline
        run: |
          sandbox-exec -p '(version 1) (allow default) (deny network*)' \
            python3 scripts/prepare-context-evidence.py --native "$RUNNER_TEMP/context-native" \
              --output "$RUNNER_TEMP/context-evidence/fixtures"
      - name: Measure all conditions sequentially with networking denied
        timeout-minutes: 30
        run: |
          sandbox-exec -p '(version 1) (allow default) (deny network*)' \
            python3 scripts/context_evidence.py \
              --fixtures "$RUNNER_TEMP/context-evidence/fixtures" \
              --output "$RUNNER_TEMP/context-evidence/results" \
              --asr-binary crates/local-transcription/target/release/compare-transcription \
              --speech-model "$HOME/.cache/voice-input-context-models/base.bin" \
              --correction-binary crates/local-correction/target/release/local-correction \
              --correction-model "$HOME/.cache/voice-input-context-models/correction.gguf" \
              --foundation-binary "$RUNNER_TEMP/foundation" --require-network-denied --repeats 2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: japanese-context-measurements
          path: ${{ runner.temp }}/context-evidence/
          retention-days: 30
          if-no-files-found: error
  slides:
    name: Build slides from measured results
    needs: measure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: japanese-context-measurements
          path: evidence
      - name: Install Japanese presentation font
        run: sudo apt-get -o Acquire::Retries=1 -o Acquire::https::Timeout=20 install -y --no-install-recommends fonts-noto-cjk
      - name: Render standalone HTML and PDF with actual numbers
        env:
          EVIDENCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 scripts/context-slides.py --report evidence/results/results.json --output presentation
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --virtual-time-budget=3000 \
            --dump-dom "file://$PWD/presentation/slides.html" > "$RUNNER_TEMP/slides-layout.html"
          python3 -c 'import os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"slides-layout.html"; assert "data-layout=\"passed\"" in p.read_text(), "Slide content overlaps footer or is clipped"'
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --no-pdf-header-footer \
            --print-to-pdf="$PWD/presentation/slides.pdf" "file://$PWD/presentation/slides.html"
          cat presentation/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: japanese-context-presentation
          path: presentation/
          retention-days: 30
