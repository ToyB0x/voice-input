name: Correction model reuse

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: correction-reuse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-policy:
    uses: ./.github/workflows/dependency-policy.yml
  reuse:
    name: Real Qwen reuse with networking denied
    needs: dependency-policy
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            crates/local-correction/target
          key: macos26-${{ runner.arch }}-correction-reuse-v1-${{ hashFiles('crates/local-correction/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Build quiet production helper and test framing
        run: |
          cargo test --manifest-path crates/local-correction/Cargo.toml --locked
          cargo build --manifest-path crates/local-correction/Cargo.toml --release --locked --bin local-correction
      - name: Prepare checksum-verified model (setup only)
        run: python3 scripts/prepare-correction-model.py "$RUNNER_TEMP/qwen.gguf"
      - name: Compare fresh and reused inference offline
        timeout-minutes: 12
        run: |
          sandbox-exec -p '(version 1) (allow default) (deny network*)' \
            python3 scripts/verify-correction-reuse.py \
            --binary crates/local-correction/target/release/local-correction \
            --model "$RUNNER_TEMP/qwen.gguf" --output "$RUNNER_TEMP/reuse-evidence"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: correction-reuse-cpu
          path: ${{ runner.temp }}/reuse-evidence/
          retention-days: 14
          if-no-files-found: warn
