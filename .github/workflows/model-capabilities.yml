name: macOS 27 exit baseline
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exit:
    runs-on: xcode-27
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          github-token: ${{ github.token }}
          run-id: 40253604434
          name: voice-input-macos-ARM64-1
          path: ${{ runner.temp }}/app
      - name: Verify immutable baseline app and extract
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'app'
          p=json.loads((root/'provenance.json').read_text())
          assert p['source_revision']=='786d89ce4b00c208e3ac7191e6aa08c0f3f581f2'
          assert p['archive_sha256']==hashlib.sha256((root/'Voice-Input-macos.zip').read_bytes()).hexdigest()
          PYCODE
          ditto -x -k "$RUNNER_TEMP/app/Voice-Input-macos.zip" "$RUNNER_TEMP/app"
      - name: Prepare fixed public weights and verify actual exit codes
        shell: bash
        run: |
          python3 scripts/prepare-transcription-model.py "$RUNNER_TEMP/base.bin"
          python3 scripts/verify-macos-exit.py --app "$RUNNER_TEMP/app/Voice Input.app" --model "$RUNNER_TEMP/base.bin" --output "$RUNNER_TEMP/exit"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: macos27-exit-baseline
          path: ${{ runner.temp }}/exit/
          retention-days: 14
