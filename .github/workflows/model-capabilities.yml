name: Isolated macOS authorization probe
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  authorization:
    runs-on: macos-26
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: voice-input-macos-ARM64-1
          run-id: 40198147067
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/tested-app
      - name: Configure temporary authorization path
        run: echo "VOICE_INPUT_CI_AUTH_FILE=$RUNNER_TEMP/voice-input-ci-authorization.json" >> "$GITHUB_ENV"
      - name: Verify tested app and prepare fixed model
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'], 'tested-app')
          provenance = json.loads((root / 'provenance.json').read_text())
          assert provenance['archive_sha256'] == hashlib.sha256((root / 'Voice-Input-macos.zip').read_bytes()).hexdigest()
          PYCODE
          ditto -x -k "$RUNNER_TEMP/tested-app/Voice-Input-macos.zip" "$RUNNER_TEMP/tested-app/expanded"
          python3 scripts/prepare-transcription-model.py --model base "$RUNNER_TEMP/base.bin"
          python3 - <<'PYCODE'
          import json, os, secrets, subprocess
          from pathlib import Path
          config = Path.home() / 'Library/Application Support/dev.toyb0x.voiceinput/settings.json'
          config.parent.mkdir(parents=True, exist_ok=True)
          config.write_text(json.dumps(dict(version=1, modelPath=str(Path(os.environ['RUNNER_TEMP'], 'base.bin')),
              backend='cpu', shortcut='Control+Alt+KeyV')))
          credential = dict(username='voiceinput-ci', password=secrets.token_hex(24))
          path = Path(os.environ['VOICE_INPUT_CI_AUTH_FILE'])
          with open(path, 'w', opener=lambda p, f: os.open(p, f, 0o600)) as output:
              json.dump(credential, output)
          result = subprocess.run(['sudo', 'sysadminctl', '-addUser', credential['username'],
              '-fullName', 'Voice Input CI', '-home', str(path.parent / 'voice-input-ci-home'),
              '-password', credential['password'], '-admin'], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          if result.returncode:
              raise SystemExit('Could not create disposable CI authorization account')
          PYCODE
      - name: Compile current UI driver and exercise real authorization
        run: |
          mkdir -p "$RUNNER_TEMP/authorization-probe"
          cp scripts/macos-window-smoke.swift "$RUNNER_TEMP/main.swift"
          xcrun swiftc "$RUNNER_TEMP/main.swift" scripts/macos-recording-interaction.swift scripts/macos-insertion-interaction.swift scripts/macos-context-interaction.swift scripts/macos-ocr-interaction.swift scripts/macos-model-interaction.swift scripts/macos-foundation-interaction.swift scripts/macos-comparison-interaction.swift \
            -o "$RUNNER_TEMP/auth-smoke"
          "$RUNNER_TEMP/auth-smoke" "$RUNNER_TEMP/tested-app/expanded/Voice Input.app" "$RUNNER_TEMP/authorization-probe" insertion-grant
      - name: Remove disposable account
        if: always()
        run: sudo sysadminctl -deleteUser voiceinput-ci >/dev/null 2>&1 || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: isolated-authorization-probe
          path: ${{ runner.temp }}/authorization-probe/
          retention-days: 14
