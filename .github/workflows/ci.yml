name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      context_evidence:
        description: Measure Japanese homophone context and generate slides (explicit only)
        type: boolean
        default: false
      full_integration:
        description: Run the full macOS permission/audio/OCR/insertion suite
        type: boolean
        default: false
      correction_reuse:
        description: Verify real Qwen model reuse offline (explicit only)
        type: boolean
        default: false
      release_validation:
        description: Build installers with a disposable signing key (no publishing)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  context-evidence:
    name: Japanese context evidence (explicit only)
    if: github.event_name == 'workflow_dispatch' && inputs.context_evidence
    uses: ./.github/workflows/context-evidence.yml

  dependency-policy:
    name: Dependency publication dates
    uses: ./.github/workflows/dependency-policy.yml

  release-validation:
    name: Signed release packaging (explicit only)
    needs: dependency-policy
    if: github.event_name == 'workflow_dispatch' && inputs.release_validation
    uses: ./.github/workflows/release-build.yml
    with:
      tag: v0.0.1

  correction-reuse:
    name: Qwen reuse validation (explicit only)
    if: github.event_name == 'workflow_dispatch' && inputs.correction_reuse
    uses: ./.github/workflows/correction-reuse.yml

  frontend:
    name: Browser navigation and layout
    needs: dependency-policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Build and check frontend state transitions
        run: |
          pnpm run test:ui
          pnpm run build
      - name: Install Japanese fonts for readable evidence
        timeout-minutes: 2
        run: python3 scripts/prepare-presentation-font.py
      - name: Verify real browser navigation and render synthetic sample views
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node scripts/verify-ui-navigation.mjs "$RUNNER_TEMP/ui-navigation"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ui-navigation
          path: ${{ runner.temp }}/ui-navigation/
          retention-days: 14
          if-no-files-found: warn

  mise:
    name: mise setup (Linux)
    needs: dependency-policy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5
        with:
          version: 2026.10.21
          cache: true
          cache_key: mise-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.mise/config.toml', 'rust-toolchain.toml') }}
      - name: Check selected tool versions and Rust components
        run: mise exec -- python3 scripts/check-toolchain.py
      - name: Install locked frontend dependencies and verify build
        run: |
          mise exec -- pnpm install --frozen-lockfile
          mise exec -- pnpm run test:ui
          mise exec -- pnpm run build
          mise exec -- pnpm exec tauri signer generate --help

  foundation:
    name: Apple model runtime
    uses: ./.github/workflows/apple-foundation.yml

  macos:
    name: macOS app
    needs: [foundation, dependency-policy]
    uses: ./.github/workflows/macos-app.yml
    with:
      full_integration: ${{ github.event_name == 'workflow_dispatch' && inputs.full_integration }}

  transcription:
    name: Offline Japanese ASR (macOS)
    needs: dependency-policy
    runs-on: xcode-27
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            crates/local-transcription/target
          key: macos27-${{ runner.arch }}-evaluation-rust-v1-${{ hashFiles('crates/local-transcription/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Check engine formatting and Clippy
        run: |
          cargo fmt --manifest-path crates/local-transcription/Cargo.toml -- --check
          cargo clippy --manifest-path crates/local-transcription/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test and build engine
        run: |
          cargo test --manifest-path crates/local-transcription/Cargo.toml --locked
          cargo build --manifest-path crates/local-transcription/Cargo.toml --release --locked
      - name: Prepare checksum-verified model (setup only)
        run: python3 scripts/prepare-transcription-model.py "$RUNNER_TEMP/ggml-base.bin"
      - name: Verify inference with all network access denied
        timeout-minutes: 8
        env:
          VOICE_INPUT_TEST_MODEL: ${{ runner.temp }}/ggml-base.bin
        run: |
          mkdir -p "$RUNNER_TEMP/transcription-evidence"
          # Denies IPv4/IPv6, DNS and Unix network sockets in this process tree.
          policy='(version 1) (allow default) (deny network*)'
          sandbox-exec -p "$policy" python3 - <<'PY' \
            | tee "$RUNNER_TEMP/transcription-evidence/network-denied.log"
          import socket
          try:
              socket.create_connection(('127.0.0.1', 9), timeout=1)
          except PermissionError:
              print('PASS: sandbox rejects socket connection with EPERM')
          else:
              raise SystemExit('Expected sandbox PermissionError')
          PY
          sandbox-exec -p "$policy" cargo test --offline \
            --manifest-path crates/local-transcription/Cargo.toml --locked \
            --test offline -- --ignored --nocapture \
            2>&1 | tee "$RUNNER_TEMP/transcription-evidence/api-tests.log"
          sandbox-exec -p "$policy" python3 scripts/verify-comparison-pcm.py \
            --binary crates/local-transcription/target/release/compare-transcription \
            --model "$RUNNER_TEMP/ggml-base.bin" --backend metal \
            --output "$RUNNER_TEMP/transcription-evidence/comparison-pcm.json"
          for backend in metal cpu; do
            extra=()
            if [[ "$backend" = cpu ]]; then extra=(--cpu); fi
            sandbox-exec -p "$policy" python3 scripts/verify-local-transcription.py \
              --binary crates/local-transcription/target/release/local-transcription \
              --model "$RUNNER_TEMP/ggml-base.bin" \
              --report "$RUNNER_TEMP/transcription-evidence/$backend.json" "${extra[@]}" \
              2>&1 | tee "$RUNNER_TEMP/transcription-evidence/$backend.log"
          done
      - name: Upload offline transcription evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-transcription-${{ github.run_attempt }}
          path: ${{ runner.temp }}/transcription-evidence/
          retention-days: 14
          if-no-files-found: warn

  metal-capability:
    name: Inspect Metal capability (macOS 27)
    runs-on: xcode-27
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Inspect actual default GPU features
        run: xcrun swift scripts/macos-metal-capability.swift > "$RUNNER_TEMP/metal-capability.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: metal-host-capability
          path: ${{ runner.temp }}/metal-capability.json
          retention-days: 14
