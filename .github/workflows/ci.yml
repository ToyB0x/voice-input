name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS app
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install frontend dependencies
        run: npm ci
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Build frontend
        run: npm run build
      - name: Check Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Build unsigned macOS app
        run: npm run tauri build -- --bundles app --ci -- --locked
        env:
          APPLE_SIGNING_IDENTITY: "-"
      - name: Verify native window and capture screenshot
        timeout-minutes: 3
        run: |
          mkdir -p "$RUNNER_TEMP/voice-input-smoke"
          xcrun swiftc scripts/macos-window-smoke.swift \
            -o "$RUNNER_TEMP/voice-input-smoke-runner" \
            2>&1 | tee "$RUNNER_TEMP/voice-input-smoke/swift-build.log"
          "$RUNNER_TEMP/voice-input-smoke-runner" \
            "$PWD/src-tauri/target/release/bundle/macos/Voice Input.app" \
            "$RUNNER_TEMP/voice-input-smoke" \
            2>&1 | tee "$RUNNER_TEMP/voice-input-smoke/smoke.log"
      - name: Upload native window evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-window-smoke-${{ github.run_attempt }}
          path: ${{ runner.temp }}/voice-input-smoke/
          retention-days: 14
          if-no-files-found: warn
