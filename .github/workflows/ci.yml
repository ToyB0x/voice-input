name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macOS app
    runs-on: macos-14
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    defaults:
      run:
        # Explicit Bash enables -e -o pipefail, including commands piped to tee.
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Install frontend dependencies
        run: npm ci
      - name: Restore Rust build cache
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            src-tauri/target
          key: macos-${{ runner.arch }}-app-rust-v1-${{ hashFiles('src-tauri/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: macos-${{ runner.arch }}-app-rust-v1-
      - uses: actions/cache/restore@v4
        id: correction-cache
        with:
          path: crates/local-correction/target
          key: macos-${{ runner.arch }}-correction-runtime-v1-${{ hashFiles('crates/local-correction/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Check and build isolated local correction runtime
        run: |
          cargo fmt --manifest-path crates/local-correction/Cargo.toml -- --check
          cargo clippy --manifest-path crates/local-correction/Cargo.toml --locked --all-targets -- -D warnings
          cargo test --manifest-path crates/local-correction/Cargo.toml --locked
          npm run prepare-native
      - uses: actions/cache/save@v4
        if: steps.correction-cache.outputs.cache-hit != 'true'
        with:
          path: crates/local-correction/target
          key: ${{ steps.correction-cache.outputs.cache-primary-key }}
      - name: Inspect macOS permission automation support
        run: |
          mkdir -p "$RUNNER_TEMP/voice-input-smoke"
          xcrun swift -e 'import ApplicationServices; print("accessibilityTrusted=\(AXIsProcessTrusted()) canPostEvents=\(CGPreflightPostEventAccess())")' \
            | tee "$RUNNER_TEMP/voice-input-smoke/permissions-preflight.log"
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Build frontend
        run: npm run build
      - name: Check Rust
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test local audio processing
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build unsigned macOS app
        run: npm run tauri build -- --bundles app --ci -- --locked
        env:
          APPLE_SIGNING_IDENTITY: "-"
      # Save after a successful build even if a later native UI check fails.
      # Cargo rechecks local sources when restoring this dependency/build cache.
      - name: Save Rust build cache
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            src-tauri/target
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Build observable native context fixture
        run: |
          fixture="$RUNNER_TEMP/Local Context Fixture.app"
          mkdir -p "$fixture/Contents/MacOS"
          xcrun swiftc scripts/macos-context-target.swift -o "$fixture/Contents/MacOS/context-fixture"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string dev.toyb0x.contextfixture' "$fixture/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string context-fixture' "$fixture/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleName string Local Context Fixture' "$fixture/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundlePackageType string APPL' "$fixture/Contents/Info.plist"
          codesign --force --sign - "$fixture"
      - name: Verify bundled correction runtime starts without a model or network
        run: |
          runtime="$PWD/src-tauri/target/release/bundle/macos/Voice Input.app/Contents/Resources/bin/local-correction"
          test -x "$runtime"
          printf '%s' '{"transcript":"","context":""}' | \
            sandbox-exec -p '(version 1) (allow default) (deny network*)' "$runtime" /missing/model.gguf cpu \
            > "$RUNNER_TEMP/voice-input-smoke/runtime-probe.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['RUNNER_TEMP']) / 'voice-input-smoke/runtime-probe.json').read_text())
          assert report['text'] == '' and report['offloaded_layers'] == 0
          PY
      - name: Verify native window and capture screenshot
        timeout-minutes: 3
        run: |
          mkdir -p "$RUNNER_TEMP/voice-input-smoke"
          cp scripts/macos-window-smoke.swift "$RUNNER_TEMP/main.swift"
          xcrun swiftc "$RUNNER_TEMP/main.swift" scripts/macos-recording-interaction.swift scripts/macos-insertion-interaction.swift scripts/macos-context-interaction.swift scripts/macos-ocr-interaction.swift \
            -o "$RUNNER_TEMP/voice-input-smoke-runner" \
            2>&1 | tee "$RUNNER_TEMP/voice-input-smoke/swift-build.log"
          "$RUNNER_TEMP/voice-input-smoke-runner" \
            "$PWD/src-tauri/target/release/bundle/macos/Voice Input.app" \
            "$RUNNER_TEMP/voice-input-smoke" \
            2>&1 | tee "$RUNNER_TEMP/voice-input-smoke/smoke.log"
      - name: Install virtual microphone for synthetic audio
        timeout-minutes: 5
        run: |
          brew install --cask blackhole-2ch
          brew install switchaudio-osx
          sudo killall coreaudiod
          for attempt in {1..30}; do
            if SwitchAudioSource -a -t input | grep -Fxq 'BlackHole 2ch'; then
              break
            fi
            sleep 1
          done
          SwitchAudioSource -s 'BlackHole 2ch' -t input
          SwitchAudioSource -s 'BlackHole 2ch' -t output
          SwitchAudioSource -c -t input | tee "$RUNNER_TEMP/voice-input-smoke/input-device.txt"
      - name: Verify real microphone permission and recording controls
        timeout-minutes: 5
        run: |
          app="$PWD/src-tauri/target/release/bundle/macos/Voice Input.app"
          /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app/Contents/Info.plist"
          codesign --verify --strict "$app"
          codesign -d --entitlements :- "$app" \
            > "$RUNNER_TEMP/voice-input-smoke/entitlements.plist" \
            2> "$RUNNER_TEMP/voice-input-smoke/codesign.log"
          test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.device.audio-input' "$RUNNER_TEMP/voice-input-smoke/entitlements.plist")" = true
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f "$app"
          tccutil reset Microphone dev.toyb0x.voiceinput
          "$RUNNER_TEMP/voice-input-smoke-runner" "$app" \
            "$RUNNER_TEMP/voice-input-smoke/permission-denied" deny \
            2>&1 | tee "$RUNNER_TEMP/voice-input-smoke/permission-denied.log"
          tccutil reset Microphone dev.toyb0x.voiceinput
          python3 - <<'PY'
          import array, math, os, wave
          from pathlib import Path
          tone = array.array('h', (int(math.sin(i * 2 * math.pi * 440 / 48000) * 8192) for i in range(48000)))
          with wave.open(str(Path(os.environ['RUNNER_TEMP']) / 'voice-input-tone.wav'), 'wb') as audio:
              audio.setparams((1, 2, 48000, 0, 'NONE', 'not compressed'))
              audio.writeframes(tone.tobytes() * 60)
          PY
          afplay "$RUNNER_TEMP/voice-input-tone.wav" \
            > "$RUNNER_TEMP/voice-input-smoke/tone.log" 2>&1 &
          tone_pid=$!
          trap 'kill "$tone_pid" 2>/dev/null || true' EXIT
          "$RUNNER_TEMP/voice-input-smoke-runner" "$app" \
            "$RUNNER_TEMP/voice-input-smoke/permission-allowed" allow \
            2>&1 | tee "$RUNNER_TEMP/voice-input-smoke/permission-allowed.log"
      - name: Prepare local model for app integration
        # A neutral filename verifies UI identity comes from loaded weights.
        run: python3 scripts/prepare-transcription-model.py "$RUNNER_TEMP/local-model.bin"
      - name: Verify Japanese recording to transcription and clipboard
        timeout-minutes: 7
        env:
          VOICE_INPUT_TEST_MODEL: ${{ runner.temp }}/local-model.bin
          VOICE_INPUT_TEST_AUDIO: ${{ github.workspace }}/crates/local-transcription/tests/fixtures/ja-oku.wav
        run: |
          tccutil reset Microphone dev.toyb0x.voiceinput
          "$RUNNER_TEMP/voice-input-smoke-runner" \
            "$PWD/src-tauri/target/release/bundle/macos/Voice Input.app" \
            "$RUNNER_TEMP/voice-input-smoke/transcription" transcribe \
            2>&1 | tee "$RUNNER_TEMP/voice-input-smoke/transcription.log"
      - name: Verify resident tray, background shortcut and preference restoration
        timeout-minutes: 8
        env:
          VOICE_INPUT_TEST_MODEL: ${{ runner.temp }}/local-model.bin
          VOICE_INPUT_TEST_AUDIO: ${{ github.workspace }}/crates/local-transcription/tests/fixtures/ja-oku.wav
        run: |
          "$RUNNER_TEMP/voice-input-smoke-runner" \
            "$PWD/src-tauri/target/release/bundle/macos/Voice Input.app" \
            "$RUNNER_TEMP/voice-input-smoke/desktop" desktop \
            2>&1 | tee "$RUNNER_TEMP/voice-input-smoke/desktop.log"
      - name: Build synthetic native guard fields
        run: |
          fixture="$RUNNER_TEMP/Insertion Guard Fixture.app"
          mkdir -p "$fixture/Contents/MacOS"
          xcrun swiftc scripts/macos-insertion-target.swift -o "$fixture/Contents/MacOS/guard-fixture"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string dev.toyb0x.insertionfixture' "$fixture/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string guard-fixture' "$fixture/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleName string Insertion Guard Fixture' "$fixture/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundlePackageType string APPL' "$fixture/Contents/Info.plist"
          codesign --force --sign - "$fixture"
      - name: Verify untrusted context falls back to audio only
        timeout-minutes: 5
        env:
          VOICE_INPUT_TEST_AUDIO: ${{ github.workspace }}/crates/local-transcription/tests/fixtures/ja-oku.wav
        run: |
          tccutil reset Accessibility dev.toyb0x.voiceinput
          "$RUNNER_TEMP/voice-input-smoke-runner" \
            "$PWD/src-tauri/target/release/bundle/macos/Voice Input.app" \
            "$RUNNER_TEMP/voice-input-smoke/context-denied" context-denied \
            2>&1 | tee "$RUNNER_TEMP/voice-input-smoke/context-denied.log"
      - name: Verify untrusted product refuses direct insertion
        timeout-minutes: 5
        env:
          VOICE_INPUT_TEST_AUDIO: ${{ github.workspace }}/crates/local-transcription/tests/fixtures/ja-oku.wav
        run: |
          tccutil reset Accessibility dev.toyb0x.voiceinput
          "$RUNNER_TEMP/voice-input-smoke-runner" \
            "$PWD/src-tauri/target/release/bundle/macos/Voice Input.app" \
            "$RUNNER_TEMP/voice-input-smoke/insertion-denied" insertion-denied \
            2>&1 | tee "$RUNNER_TEMP/voice-input-smoke/insertion-denied.log"
      - name: Allow product Accessibility through System Settings in disposable CI
        timeout-minutes: 4
        env:
          VOICE_INPUT_CI_AUTH_FILE: ${{ runner.temp }}/voice-input-ci-authorization.json
        run: |
          # A fresh, disposable credential only for this runner's real OS dialog.
          # Never print it, include it in exceptions, or put it under artifacts.
          python3 - <<'PY'
          import json, os, secrets, subprocess
          from pathlib import Path
          credential = dict(username='voiceinput-ci', password=secrets.token_hex(24))
          path = Path(os.environ['VOICE_INPUT_CI_AUTH_FILE'])
          with open(path, 'w', opener=lambda p, f: os.open(p, f, 0o600)) as output:
              json.dump(credential, output)
          result = subprocess.run(['sudo', 'sysadminctl', '-addUser', credential['username'],
              '-fullName', 'Voice Input CI', '-home', str(path.parent / 'voice-input-ci-home'),
              '-password', credential['password'], '-admin'], stdout=subprocess.PIPE, stderr=subprocess.PIPE)
          if result.returncode:
              raise SystemExit('Could not create disposable CI authorization account')
          PY
          "$RUNNER_TEMP/voice-input-smoke-runner" \
            "$PWD/src-tauri/target/release/bundle/macos/Voice Input.app" \
            "$RUNNER_TEMP/voice-input-smoke/insertion-grant" insertion-grant \
            2>&1 | tee "$RUNNER_TEMP/voice-input-smoke/insertion-grant.log"
      - name: Inspect only this product's OS authorization metadata
        if: always()
        run: |
          evidence="$RUNNER_TEMP/voice-input-smoke/authorization-metadata.log"
          app="$PWD/src-tauri/target/release/bundle/macos/Voice Input.app"
          codesign -d -r- "$app" 2>&1 | tee "$evidence"
          for database in "/Library/Application Support/com.apple.TCC/TCC.db" "$HOME/Library/Application Support/com.apple.TCC/TCC.db"; do
            if sudo test -f "$database"; then
              sudo /usr/bin/sqlite3 "$database" "SELECT client,client_type,auth_value,auth_reason,length(csreq) FROM access WHERE service='kTCCServiceAccessibility' AND (client='dev.toyb0x.voiceinput' OR client LIKE '%Voice Input%');" \
                2>&1 | tee -a "$evidence" || true
            fi
          done
      - name: Prepare pinned correction model and synthetic OCR app
        timeout-minutes: 10
        run: |
          python3 scripts/prepare-correction-model.py "$RUNNER_TEMP/correction-model.gguf"
          fixture="$RUNNER_TEMP/Local OCR Fixture.app"
          mkdir -p "$fixture/Contents/MacOS"
          xcrun swiftc scripts/macos-ocr-target.swift -o "$fixture/Contents/MacOS/ocr-fixture"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleIdentifier string dev.toyb0x.ocrfixture' "$fixture/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleExecutable string ocr-fixture' "$fixture/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundleName string Local OCR Fixture' "$fixture/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Add :CFBundlePackageType string APPL' "$fixture/Contents/Info.plist"
          codesign --force --sign - "$fixture"
      - name: Verify denied screen permission leaves voice input usable
        timeout-minutes: 5
        env:
          VOICE_INPUT_TEST_AUDIO: ${{ github.workspace }}/crates/local-transcription/tests/fixtures/ja-oku.wav
          VOICE_INPUT_OCR_TARGET: ${{ runner.temp }}/Local OCR Fixture.app
        run: |
          tccutil reset ScreenCapture dev.toyb0x.voiceinput
          "$RUNNER_TEMP/voice-input-smoke-runner" \
            "$PWD/src-tauri/target/release/bundle/macos/Voice Input.app" \
            "$RUNNER_TEMP/voice-input-smoke/ocr-denied" ocr-denied \
            2>&1 | tee "$RUNNER_TEMP/voice-input-smoke/ocr-denied.log"
      - name: Grant real product Screen Recording consent
        timeout-minutes: 5
        env:
          VOICE_INPUT_CI_AUTH_FILE: ${{ runner.temp }}/voice-input-ci-authorization.json
        run: |
          "$RUNNER_TEMP/voice-input-smoke-runner" \
            "$PWD/src-tauri/target/release/bundle/macos/Voice Input.app" \
            "$RUNNER_TEMP/voice-input-smoke/ocr-grant" ocr-grant \
            2>&1 | tee "$RUNNER_TEMP/voice-input-smoke/ocr-grant.log"
          pkill -x voice-input || true
      - name: Verify real OCR, correction preview, copy and cancellation
        timeout-minutes: 10
        env:
          VOICE_INPUT_TEST_AUDIO: ${{ github.workspace }}/crates/local-transcription/tests/fixtures/ja-oku.wav
          VOICE_INPUT_OCR_TARGET: ${{ runner.temp }}/Local OCR Fixture.app
          VOICE_INPUT_CORRECTION_MODEL: ${{ runner.temp }}/correction-model.gguf
        run: |
          "$RUNNER_TEMP/voice-input-smoke-runner" \
            "$PWD/src-tauri/target/release/bundle/macos/Voice Input.app" \
            "$RUNNER_TEMP/voice-input-smoke/ocr" ocr \
            2>&1 | tee "$RUNNER_TEMP/voice-input-smoke/ocr.log"
      - name: Verify bounded context, opt-out and protected field exclusions
        timeout-minutes: 10
        env:
          VOICE_INPUT_TEST_AUDIO: ${{ github.workspace }}/crates/local-transcription/tests/fixtures/ja-oku.wav
          VOICE_INPUT_CONTEXT_TARGET: ${{ runner.temp }}/Local Context Fixture.app
        run: |
          "$RUNNER_TEMP/voice-input-smoke-runner" \
            "$PWD/src-tauri/target/release/bundle/macos/Voice Input.app" \
            "$RUNNER_TEMP/voice-input-smoke/context" context \
            2>&1 | tee "$RUNNER_TEMP/voice-input-smoke/context.log"
      - name: Verify context preference restores without retained text
        timeout-minutes: 3
        run: |
          "$RUNNER_TEMP/voice-input-smoke-runner" \
            "$PWD/src-tauri/target/release/bundle/macos/Voice Input.app" \
            "$RUNNER_TEMP/voice-input-smoke/context-restore" context-restore \
            2>&1 | tee "$RUNNER_TEMP/voice-input-smoke/context-restore.log"
          python3 - <<'PY'
          import json
          from pathlib import Path
          settings = json.loads((Path.home() / 'Library/Application Support/dev.toyb0x.voiceinput/settings.json').read_text())
          assert settings['recognitionContext'] is True
          assert set(settings) == {'version', 'modelPath', 'backend', 'shortcut', 'autoInsert', 'recognitionContext', 'ocrContext', 'whisperContext', 'correctionContext', 'correctionModelPath', 'correctionBackend'}
          PY
      - name: Verify trusted product insertion and cancellation guards
        timeout-minutes: 12
        env:
          VOICE_INPUT_TEST_AUDIO: ${{ github.workspace }}/crates/local-transcription/tests/fixtures/ja-oku.wav
          VOICE_INPUT_INSERTION_TARGET: ${{ runner.temp }}/Insertion Guard Fixture.app
        run: |
          "$RUNNER_TEMP/voice-input-smoke-runner" \
            "$PWD/src-tauri/target/release/bundle/macos/Voice Input.app" \
            "$RUNNER_TEMP/voice-input-smoke/insertion" insertion \
            2>&1 | tee "$RUNNER_TEMP/voice-input-smoke/insertion.log"
      - name: Remove disposable CI authorization account
        if: always()
        run: |
          sudo sysadminctl -deleteUser voiceinput-ci >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/voice-input-ci-authorization.json"
      - name: Check compiler and smoke failure exit statuses
        run: |
          negative="$RUNNER_TEMP/voice-input-smoke/expected-failures"
          mkdir -p "$negative"
          printf '%s\n' '#error("Expected compiler failure for CI regression check")' \
            > "$negative/invalid.swift"

          # Capture intentional failures without disabling pipefail. If tee masks
          # either producer's exit status, this regression check must fail.
          set +e
          xcrun swiftc "$negative/invalid.swift" -o "$negative/invalid" \
            2>&1 | tee "$negative/swift-build.log"
          compile_status=$?
          "$RUNNER_TEMP/voice-input-smoke-runner" \
            "$negative/missing.app" "$negative/smoke" \
            2>&1 | tee "$negative/smoke.log"
          smoke_status=$?
          set -e

          printf '{"compile_status": %d, "smoke_status": %d}\n' \
            "$compile_status" "$smoke_status" > "$negative/exit-statuses.json"
          if [[ "$compile_status" -eq 0 || "$smoke_status" -ne 1 ]]; then
            echo "::error::Compiler or smoke failure was not propagated through tee"
            exit 1
          fi
      - name: Upload native window evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-window-smoke-${{ github.run_attempt }}
          path: ${{ runner.temp }}/voice-input-smoke/
          retention-days: 14
          if-no-files-found: warn

  transcription:
    name: Offline Japanese ASR (macOS)
    runs-on: macos-14
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check engine formatting and Clippy
        run: |
          cargo fmt --manifest-path crates/local-transcription/Cargo.toml -- --check
          cargo clippy --manifest-path crates/local-transcription/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test and build engine
        run: |
          cargo test --manifest-path crates/local-transcription/Cargo.toml --locked
          cargo build --manifest-path crates/local-transcription/Cargo.toml --release --locked
      - name: Prepare checksum-verified model (setup only)
        run: python3 scripts/prepare-transcription-model.py "$RUNNER_TEMP/ggml-base.bin"
      - name: Verify inference with all network access denied
        timeout-minutes: 8
        env:
          VOICE_INPUT_TEST_MODEL: ${{ runner.temp }}/ggml-base.bin
        run: |
          mkdir -p "$RUNNER_TEMP/transcription-evidence"
          # Denies IPv4/IPv6, DNS and Unix network sockets in this process tree.
          policy='(version 1) (allow default) (deny network*)'
          sandbox-exec -p "$policy" python3 - <<'PY' \
            | tee "$RUNNER_TEMP/transcription-evidence/network-denied.log"
          import socket
          try:
              socket.create_connection(('127.0.0.1', 9), timeout=1)
          except PermissionError:
              print('PASS: sandbox rejects socket connection with EPERM')
          else:
              raise SystemExit('Expected sandbox PermissionError')
          PY
          sandbox-exec -p "$policy" cargo test --offline \
            --manifest-path crates/local-transcription/Cargo.toml --locked \
            --test offline -- --ignored --nocapture \
            2>&1 | tee "$RUNNER_TEMP/transcription-evidence/api-tests.log"
          for backend in metal cpu; do
            extra=()
            if [[ "$backend" = cpu ]]; then extra=(--cpu); fi
            sandbox-exec -p "$policy" python3 scripts/verify-local-transcription.py \
              --binary crates/local-transcription/target/release/local-transcription \
              --model "$RUNNER_TEMP/ggml-base.bin" \
              --report "$RUNNER_TEMP/transcription-evidence/$backend.json" "${extra[@]}" \
              2>&1 | tee "$RUNNER_TEMP/transcription-evidence/$backend.log"
          done
      - name: Upload offline transcription evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-transcription-${{ github.run_attempt }}
          path: ${{ runner.temp }}/transcription-evidence/
          retention-days: 14
          if-no-files-found: warn
