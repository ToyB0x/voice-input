name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '7 18 * * 0'
  workflow_dispatch:
    inputs:
      full_integration:
        description: Run the full macOS permission/audio/OCR/insertion suite
        type: boolean
        default: true
      release_validation:
        description: Build installers with a disposable signing key (no publishing)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  release-validation:
    name: Signed release packaging (explicit only)
    if: github.event_name == 'workflow_dispatch' && inputs.release_validation
    uses: ./.github/workflows/release.yml
    with:
      tag: v0.1.1

  foundation:
    name: Apple model runtime
    uses: ./.github/workflows/apple-foundation.yml

  macos:
    name: macOS app
    needs: foundation
    uses: ./.github/workflows/macos-app.yml
    with:
      full_integration: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_integration) }}

  transcription:
    name: Offline Japanese ASR (macOS)
    runs-on: macos-14
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            crates/local-transcription/target
          key: macos-${{ runner.arch }}-evaluation-rust-v1-${{ hashFiles('crates/local-transcription/Cargo.lock', 'rust-toolchain.toml') }}
      - name: Check engine formatting and Clippy
        run: |
          cargo fmt --manifest-path crates/local-transcription/Cargo.toml -- --check
          cargo clippy --manifest-path crates/local-transcription/Cargo.toml --locked --all-targets -- -D warnings
      - name: Test and build engine
        run: |
          cargo test --manifest-path crates/local-transcription/Cargo.toml --locked
          cargo build --manifest-path crates/local-transcription/Cargo.toml --release --locked
      - name: Prepare checksum-verified model (setup only)
        run: python3 scripts/prepare-transcription-model.py "$RUNNER_TEMP/ggml-base.bin"
      - name: Verify inference with all network access denied
        timeout-minutes: 8
        env:
          VOICE_INPUT_TEST_MODEL: ${{ runner.temp }}/ggml-base.bin
        run: |
          mkdir -p "$RUNNER_TEMP/transcription-evidence"
          # Denies IPv4/IPv6, DNS and Unix network sockets in this process tree.
          policy='(version 1) (allow default) (deny network*)'
          sandbox-exec -p "$policy" python3 - <<'PY' \
            | tee "$RUNNER_TEMP/transcription-evidence/network-denied.log"
          import socket
          try:
              socket.create_connection(('127.0.0.1', 9), timeout=1)
          except PermissionError:
              print('PASS: sandbox rejects socket connection with EPERM')
          else:
              raise SystemExit('Expected sandbox PermissionError')
          PY
          sandbox-exec -p "$policy" cargo test --offline \
            --manifest-path crates/local-transcription/Cargo.toml --locked \
            --test offline -- --ignored --nocapture \
            2>&1 | tee "$RUNNER_TEMP/transcription-evidence/api-tests.log"
          sandbox-exec -p "$policy" python3 scripts/verify-comparison-pcm.py \
            --binary crates/local-transcription/target/release/compare-transcription \
            --model "$RUNNER_TEMP/ggml-base.bin" --backend metal \
            --output "$RUNNER_TEMP/transcription-evidence/comparison-pcm.json"
          for backend in metal cpu; do
            extra=()
            if [[ "$backend" = cpu ]]; then extra=(--cpu); fi
            sandbox-exec -p "$policy" python3 scripts/verify-local-transcription.py \
              --binary crates/local-transcription/target/release/local-transcription \
              --model "$RUNNER_TEMP/ggml-base.bin" \
              --report "$RUNNER_TEMP/transcription-evidence/$backend.json" "${extra[@]}" \
              2>&1 | tee "$RUNNER_TEMP/transcription-evidence/$backend.log"
          done
      - name: Upload offline transcription evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-transcription-${{ github.run_attempt }}
          path: ${{ runner.temp }}/transcription-evidence/
          retention-days: 14
          if-no-files-found: warn

  metal-capability:
    name: Inspect Metal capability (latest macOS)
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Inspect actual default GPU features
        run: xcrun swift scripts/macos-metal-capability.swift > "$RUNNER_TEMP/metal-capability.json"
      - uses: actions/upload-artifact@v4
        with:
          name: metal-host-capability
          path: ${{ runner.temp }}/metal-capability.json
          retention-days: 14
