name: Build signed macOS release assets

on:
  workflow_call:
    inputs:
      tag:
        description: Stable release version
        required: true
        type: string
    secrets:
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 35
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}
      - name: Cache immutable registry publication metadata
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/voice-input-release-metadata
          key: registry-age-${{ runner.os }}-v1-${{ hashFiles('**/Cargo.lock', 'package.json') }}
          restore-keys: registry-age-${{ runner.os }}-v1-
      - name: Enforce 48-hour dependency cooling before building
        run: python3 scripts/check-dependency-age.py
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: rustup show
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            src-tauri/target
            crates/local-correction/target
            crates/local-transcription/target
          key: release-${{ runner.arch }}-${{ hashFiles('src-tauri/Cargo.lock', 'crates/local-correction/Cargo.lock', 'crates/local-transcription/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: release-${{ runner.arch }}-
      - name: Validate version and configure signed artifacts
        run: |
          python3 scripts/release-assets.py version --tag "$RELEASE_TAG"
      - name: Build signed update and initial installer
        env:
          RELEASE_PUBLIC_KEY: ${{ github.event_name == 'release' && vars.TAURI_UPDATER_PUBLIC_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.event_name == 'release' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ github.event_name == 'release' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          PUBLISH: ${{ github.event_name == 'release' }}
          APPLE_SIGNING_IDENTITY: '-'
        run: |
          if [[ "$PUBLISH" == true ]]; then
            if [[ -z "$RELEASE_PUBLIC_KEY" || -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
              echo 'Configure TAURI_UPDATER_PUBLIC_KEY (variable) and TAURI_SIGNING_PRIVATE_KEY (secret) before publishing.' >&2
              exit 1
            fi
            export VOICE_INPUT_UPDATER_PUBLIC_KEY="$RELEASE_PUBLIC_KEY"
          else
            # A manual build can prove packaging without accessing a permanent private key.
            unset TAURI_SIGNING_PRIVATE_KEY
            export TAURI_SIGNING_PRIVATE_KEY_PASSWORD=''
            pnpm exec tauri signer generate --ci --password '' --write-keys "$RUNNER_TEMP/disposable-update.key" > /dev/null 2>&1
            chmod 600 "$RUNNER_TEMP/disposable-update.key"
            export TAURI_SIGNING_PRIVATE_KEY="$RUNNER_TEMP/disposable-update.key"
            export VOICE_INPUT_UPDATER_PUBLIC_KEY
            VOICE_INPUT_UPDATER_PUBLIC_KEY="$(cat "$RUNNER_TEMP/disposable-update.key.pub")"
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config={'bundle':{'createUpdaterArtifacts':True},'plugins':{'updater':{'pubkey':os.environ['VOICE_INPUT_UPDATER_PUBLIC_KEY']}}}
          (Path(os.environ['RUNNER_TEMP'])/'release-config.json').write_text(json.dumps(config))
          PY
          pnpm run tauri build --bundles app,dmg --ci --config "$RUNNER_TEMP/release-config.json" -- --locked
          python3 scripts/release-assets.py package --tag "$RELEASE_TAG" --bundle src-tauri/target/release/bundle --output "$RUNNER_TEMP/release-assets"
          # Verify the actual updater archive with the official plugin before publishing.
          export VOICE_INPUT_VERIFY_UPDATE_DIR="$RUNNER_TEMP/release-assets"
          cargo test --manifest-path src-tauri/Cargo.toml --locked official_updater_signature -- --nocapture
      - name: Remove disposable private key
        if: always()
        run: rm -f "$RUNNER_TEMP/disposable-update.key" "$RUNNER_TEMP/disposable-update.key.pub"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-release-${{ github.run_id }}
          path: ${{ runner.temp }}/release-assets/
          retention-days: 14
          if-no-files-found: error

