[package]
name = "local-transcription"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
thiserror = "2"
hound = "3.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "=0.16.0", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = "=0.16.0"
