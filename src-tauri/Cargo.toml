[package]
name = "voice-input"
version = "0.1.0"
description = "A macOS voice input app built with Tauri"
edition = "2024"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-global-shortcut = "2"
cpal = "0.18.2"
objc2 = "0.6"
block2 = "0.6"
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }

local-transcription = { path = "../crates/local-transcription" }
arboard = { version = "3.6", default-features = false }
