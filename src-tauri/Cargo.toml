[package]
name = "voice-input"
version = "0.1.0"
description = "A macOS voice input app built with Tauri"
edition = "2024"
publish = false

[features]
# Diagnostic-only build; never enabled in release packaging.
ci-restart-probe = []

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
local-comparison = { path = "../crates/local-comparison" }


[target.'cfg(target_os = "macos")'.dependencies]
local-models = { path = "../crates/local-models" }
tauri-plugin-updater = "2.14.0"
tauri-plugin-global-shortcut = "2.4.1"
core-foundation = "0.10.1"
cpal = "0.18.2"
objc2 = "0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSPanel", "NSWindow", "NSView", "NSResponder", "NSTextField", "NSControl", "NSColor", "NSFont", "NSProgressIndicator", "NSScreen", "NSGraphics", "NSImageRep", "NSBitmapImageRep"] }
block2 = "0.6.2"
objc2-av-foundation = { version = "0.3.2", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }

local-transcription = { path = "../crates/local-transcription" }
arboard = { version = "3.7.0", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3.2"
default-features = false
features = ["std", "NSArray", "NSDictionary", "NSError", "NSString", "NSObject"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-screen-capture-kit]
version = "=0.3.2"
default-features = false
features = ["std", "SCStream", "SCShareableContent", "SCScreenshotManager", "block2", "objc2-core-foundation", "objc2-core-graphics", "objc2-core-media", "libc"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-vision]
version = "=0.3.2"
default-features = false
features = ["std", "VNRequest", "VNRequestHandler", "VNRecognizeTextRequest", "VNObservation", "VNTypes", "objc2-core-graphics", "block2"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-foundation]
version = "0.3.2"
features = ["CFCGTypes"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-core-graphics]
version = "0.3.2"
features = ["CGImage"]

[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }

[[test]]
name = "overlay-window"
path = "tests/overlay-window.rs"
harness = false
