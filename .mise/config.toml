min_version = "2026.10.18"

[tools]
# Keep these in sync with .nvmrc and package.json; CI checks for drift.
node = "26.13.0"
# Use the same npm distribution checked by the bootstrap release-age gate.
"npm:pnpm" = "12.16.1"
python = "3.15.2"
cmake = "4.4.5"

[settings]
# Reuse the existing Rust version, minimal profile, rustfmt and clippy pins.
idiomatic_version_file_enable_tools = ["rust"]

[settings.node]
compile = false

[settings.python]
compile = false
